    <script>
      // Safari (a diferencia de Chrome) restaura la posición de scroll
      // anterior al recargar la página, y con scroll-snap-type: mandatory
      // eso hacía que un reload arrancara en "Misión" en vez de en el hero.
      // Se desactiva lo antes posible, antes de que el navegador llegue a
      // aplicarla — recién con el bundle ya sería tarde.
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
    </script>
