    <script>
      // Safari (a diferencia de Chrome) restaura la posición de scroll
      // anterior al recargar la página, y con scroll-snap-type: mandatory
      // eso hacía que un reload arrancara en "Misión" en vez de en el hero.
      //
      // Causa real (encontrada después de que scrollRestoration="manual" no
      // alcanzara, reportado en un iPhone real): html tenía un
      // "scroll-behavior: smooth" GLOBAL (ver index.css — se sacó), que se
      // aplica a TODO scroll sin behavior explícito, incluida la propia
      // restauración de scroll del navegador al recargar. Con
      // scroll-snap-stop:always en cada sección, un scroll animado que
      // intenta llegar a una posición profunda de la página tiene que
      // frenar en cada sección que cruza — y Safari, en vez de ir
      // frenando sección por sección, corta ahí y se queda en la primera
      // ("Misión", justo después del hero). Eso explica por qué siempre
      // frenaba ahí puntualmente y no en cualquier sección al azar.
      //
      // Con esa propiedad ambiente ya sacada, la restauración nativa
      // debería volver a ser instantánea (sin nada que scroll-snap-stop
      // pueda interceptar) — pero como no se pudo confirmar en un Safari
      // real, esto se deja además como respaldo: fuerza el scroll a 0 a
      // mano en "load" y "pageshow" (que además cubre una restauración
      // desde bfcache, que "load" solo no dispara), y lo repite un par de
      // veces más con un pequeño delay por si esa restauración nativa
      // completa recién después de este primer intento. El sitio no usa
      // anclas de sección en la URL (no hay location.hash en ningún lado),
      // así que forzar el tope en cada carga no rompe ningún link a una
      // sección específica.
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
      var forceScrollToTop = function () {
        window.scrollTo(0, 0);
        setTimeout(function () {
          window.scrollTo(0, 0);
        }, 100);
        setTimeout(function () {
          window.scrollTo(0, 0);
        }, 400);
      };
      window.addEventListener("load", forceScrollToTop);
      window.addEventListener("pageshow", forceScrollToTop);

      // Respaldo extra SOLO para la recarga que dispara el botón de "subir"
      // en mobile (ver scrollToTop en HomePage.tsx): reportado en un
      // iPhone real que, pese a todo lo de arriba, la página seguía
      // recargando en el mismo lugar en vez de en el hero. Esto dice que
      // lo que sea que restaura el scroll en Safari actúa más tarde o más
      // fuerte de lo que "load"/"pageshow" + reintentos con delay pueden
      // cubrir. En vez de seguir adivinando CUÁNDO pasa eso, acá se
      // cancela activamente cualquier scroll que se aleje de 0 durante los
      // primeros segundos después de esa recarga puntual — no importa qué
      // lo esté causando. HomePage.tsx deja esta marca en sessionStorage
      // justo antes de navegar; si no está presente (cualquier otra carga
      // normal de la página), esto no hace nada.
      try {
        if (sessionStorage.getItem("mackst:scrollToTopReload") === "1") {
          sessionStorage.removeItem("mackst:scrollToTopReload");
          // HomePage.tsx navega a esta misma URL con un parámetro "_top"
          // agregado (para que Safari no tenga ninguna posición de scroll
          // guardada asociada a ella) — lo saca de la barra de direcciones
          // ahora que ya cumplió su propósito, sin disparar otra navegación.
          if (window.location.search.indexOf("_top=") !== -1) {
            var cleanUrl = new URL(window.location.href);
            cleanUrl.searchParams.delete("_top");
            window.history.replaceState(null, "", cleanUrl.toString());
          }
          var guardUntil = Date.now() + 3000;
          var cancelDrift = function () {
            if (Date.now() > guardUntil) {
              window.removeEventListener("scroll", cancelDrift);
              return;
            }
            if (window.scrollY !== 0) {
              window.scrollTo(0, 0);
            }
          };
          window.addEventListener("scroll", cancelDrift, { passive: true });
          setTimeout(function () {
            window.removeEventListener("scroll", cancelDrift);
          }, 3000);
        }
      } catch (e) {
        // sessionStorage puede fallar en navegación privada — no es
        // crítico, el resto de las mitigaciones de arriba siguen en pie.
      }
    </script>
